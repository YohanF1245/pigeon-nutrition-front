version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
      - ORIGIN=http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - pigeon-nutrition-back_app-network

networks:
  pigeon-nutrition-back_app-network:
    external: true
